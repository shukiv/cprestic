{{define "layout"}}
<script>
/* Light unless this browser has been told otherwise; see layout.html. */
(function () {
  var choice = "light";
  try {
    var stored = localStorage.getItem("cprest.theme");
    if (stored === "light" || stored === "dark" || stored === "system") { choice = stored; }
  } catch (e) {}
  if (choice !== "system") {
    document.documentElement.setAttribute("data-theme", choice);
  }
})();
</script>
<style>{{.Assets.CSS}}</style>

<div class="cprest cpr-user" dir="ltr">
  <a class="cpr-skip" href="#cprest-user-main">Skip to content</a>
  <header class="cpr-userbar">
    <a class="cpr-userbrand" href="index.live.php" aria-label="cP Restic overview">
      <span class="cpr-brand-mark" aria-hidden="true">cP:R</span>
      <span>Restic backups</span>
    </a>
    <nav class="cpr-usernav" aria-label="Backup pages">
      <a href="index.live.php" {{if eq .Nav "overview"}}aria-current="page"{{end}}>Overview</a>
      <a href="browse.live.php" {{if eq .Nav "restore"}}aria-current="page"{{end}}>Restore &amp; download</a>
    </nav>
    <span class="cpr-user-account" title="Signed-in cPanel account">{{.Data.Account}}</span>
    <div class="cpr-theme" id="theme" hidden aria-label="Colour theme">
      <button type="button" data-theme-choice="system" aria-pressed="false" aria-label="Use system theme" title="Match system">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8"/></svg>
      </button>
      <button type="button" data-theme-choice="light" aria-pressed="true" aria-label="Use light theme" title="Light">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Use dark theme" title="Dark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="cprest-user-main" tabindex="-1">
    {{with .Flash}}<div class="cpr-banner {{if eq .Kind "ok"}}cpr-ok{{else if eq .Kind "warn"}}cpr-warn{{else}}cpr-bad{{end}}" role="status">
      <div class="cpr-body">{{.Message}}</div>
    </div>{{end}}
    <div data-live="cpr-running">
    {{if .Running}}
    <div class="cpr-banner cpr-warn" role="status" data-running="1">
      <div class="cpr-body">
        {{template "runningnow" .Running}}
        <span class="cpr-hint" style="margin:var(--s1) 0 0; display:block">This page keeps itself up to date while it runs.</span>
      </div>
    </div>
    {{end}}
    </div>
    {{template "content" .}}
  </main>
</div>

<script>{{.Assets.JS}}</script>
{{end}}
