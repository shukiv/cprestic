{{define "layout"}}
<script>
/* Applied before the fragment paints, so a chosen theme does not flash the
   other one first. Storage can throw in a private window, so it is
   guarded; falling through leaves the system preference in charge. */
(function () {
  try {
    var choice = localStorage.getItem("cprest.theme");
    if (choice === "light" || choice === "dark") {
      document.documentElement.setAttribute("data-theme", choice);
    }
  } catch (e) {}
})();
</script>
<style>{{.Assets.CSS}}</style>

<div class="cprest">
  <div class="cpr-bar">
    <span class="cpr-brand"><span class="cpr-brand-cp">cP</span>:Restic</span>
    <nav>
      <a href="index.live.php" aria-current="page">Your backups</a>
    </nav>
    <div class="cpr-theme" id="theme" hidden>
      <button type="button" data-theme-choice="system" aria-pressed="true" title="Match system">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8"/></svg>
      </button>
      <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>

  <main>
    {{with .Flash}}<div class="cpr-banner {{if eq .Kind "ok"}}cpr-ok{{else if eq .Kind "warn"}}cpr-warn{{else}}cpr-bad{{end}}">
      <div class="cpr-body">{{.Message}}</div>
    </div>{{end}}
    {{template "content" .}}
  </main>
</div>

<script>{{.Assets.JS}}</script>
{{end}}
