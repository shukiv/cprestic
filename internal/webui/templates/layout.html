{{define "layout"}}
<script>
/* Applied before the fragment paints, so the theme does not flash the other
   one first. Light is what this interface is designed in and what it falls
   back to: storage can throw in a private window, and the machine's own dark
   preference is the machine's, not a choice made here. Only an explicit
   "system" hands the decision to prefers-color-scheme. */
(function () {
  var choice = "light";
  try {
    var stored = localStorage.getItem("cprest.theme");
    if (stored === "light" || stored === "dark" || stored === "system") { choice = stored; }
  } catch (e) {}
  if (choice !== "system") {
    document.documentElement.setAttribute("data-theme", choice);
  }
})();
</script>
<style>{{.Assets.CSS}}</style>

<div class="cprest">
  <a class="cpr-skip" href="#cprest-main">Skip to main content</a>
  <div class="cpr-shell">
    <aside class="cpr-rail">
      <a class="cpr-brand" href="?p=" aria-label="cP Restic overview">
        <span class="cpr-brand-mark">cP:R</span><span class="cpr-brand-name">cP:Restic</span>
      </a>
      <div class="cpr-server">WHM backup operations</div>

      <nav class="cpr-nav" aria-label="cP Restic pages">
        <div class="cpr-nav-label">Workspace</div>
        <a href="?p=" aria-label="Overview" {{if eq .Nav "dashboard"}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="cpr-nav-text">Overview</span>
        </a>
        <a href="?p=accounts" aria-label="Accounts" {{if or (eq .Nav "accounts") (eq .Nav "account")}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="cpr-nav-text">Accounts</span>
        </a>
        <a href="?p=destinations" aria-label="Destinations" {{if eq .Nav "destinations"}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><span class="cpr-nav-text">Destinations</span>
        </a>
        <a href="?p=schedule" aria-label="Schedules" {{if eq .Nav "schedule"}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><span class="cpr-nav-text">Schedules</span>
        </a>

        <div class="cpr-nav-label cpr-nav-label-secondary">Recovery</div>
        <a href="?p=restore" aria-label="Restore" {{if or (eq .Nav "restore") (eq .Nav "browse")}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="cpr-nav-text">Restore</span>
        </a>
        <a href="?p=jobs" aria-label="History" {{if eq .Nav "jobs"}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v5h5M3.1 13a9 9 0 1 0 2.1-6.4L3 8M12 7v5l4 2"/></svg><span class="cpr-nav-text">History</span>
        </a>
        <a href="?p=settings" aria-label="Settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span class="cpr-nav-text">Settings</span>
        </a>
      </nav>

      <div class="cpr-rail-foot"><span class="cpr-rail-state"><i></i>cPanel integration</span><span class="cpr-rail-meta">WHM administrator</span></div>
    </aside>

    <section class="cpr-workspace">
      <header class="cpr-topbar">
        <span class="cpr-breadcrumb">WHM / Plugins / cP:Restic</span>
        <div class="cpr-theme" id="theme" role="group" aria-label="Colour theme" hidden>
          <button type="button" data-theme-choice="system" aria-pressed="false" title="Match system">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg><span class="cpr-visually-hidden">Match system</span>
          </button>
          <button type="button" data-theme-choice="light" aria-pressed="true" title="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="cpr-visually-hidden">Light</span>
          </button>
          <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="cpr-visually-hidden">Dark</span>
          </button>
        </div>
      </header>

      <main id="cprest-main" tabindex="-1">
        {{with .Flash}}<div class="cpr-banner {{if eq .Kind "ok"}}cpr-ok{{else if eq .Kind "warn"}}cpr-warn{{else}}cpr-bad{{end}}">
          <div class="cpr-body">{{.Message}}</div>
        </div>{{end}}
        {{template "content" .}}
      </main>
    </section>
  </div>
</div>

<script>{{.Assets.JS}}</script>
{{end}}
