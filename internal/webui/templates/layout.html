{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · cprest backups</title>
<style>{{.Assets.CSS}}</style>
</head>
<body>
<div class="host">WHM <span>›</span> Plugins <span>›</span> <b>cprest Backups</b></div>

<header class="bar">
  <div class="brand">cprest <span>backups</span></div>
  <nav>
    <a href="?p=" {{if eq .Nav "dashboard"}}aria-current="page"{{end}}>Overview</a>
    <a href="?p=accounts" {{if eq .Nav "accounts"}}aria-current="page"{{end}}>Accounts</a>
    <a href="?p=destinations" {{if eq .Nav "destinations"}}aria-current="page"{{end}}>Destinations</a>
    <a href="?p=schedule" {{if eq .Nav "schedule"}}aria-current="page"{{end}}>Schedules</a>
    <a href="?p=jobs" {{if eq .Nav "jobs"}}aria-current="page"{{end}}>History</a>
    <a href="?p=settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>Settings</a>
  </nav>
</header>

<main>
  {{with .Flash}}<div class="banner {{if eq .Kind "ok"}}ok{{else if eq .Kind "warn"}}warn{{else}}bad{{end}}">
    <div class="body">{{.Message}}</div>
  </div>{{end}}
  {{template "content" .}}
</main>
<script>{{.Assets.JS}}</script>
</body>
</html>{{end}}
