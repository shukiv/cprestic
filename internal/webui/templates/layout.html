{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · cprest backups</title>
<style>{{.Assets.CSS}}</style>
</head>
<body>
<header class="bar">
  <span class="brand">cprest backups</span>
  <nav>
    <a href="?p=" {{if eq .Nav "dashboard"}}class="on"{{end}}>Overview</a>
    <a href="?p=destinations" {{if eq .Nav "destinations"}}class="on"{{end}}>Destinations</a>
    <a href="?p=schedule" {{if eq .Nav "schedule"}}class="on"{{end}}>Schedules</a>
    <a href="?p=accounts" {{if eq .Nav "accounts"}}class="on"{{end}}>Accounts</a>
    <a href="?p=restore" {{if eq .Nav "restore"}}class="on"{{end}}>Restore</a>
    <a href="?p=jobs" {{if eq .Nav "jobs"}}class="on"{{end}}>History</a>
    <a href="?p=settings" {{if eq .Nav "settings"}}class="on"{{end}}>Settings</a>
  </nav>
</header>
<main>
  <h1>{{.Title}}</h1>
  {{with .Flash}}<div class="flash {{.Kind}}">{{.Message}}</div>{{end}}
  {{template "content" .}}
</main>
<script>{{.Assets.JS}}</script>
</body>
</html>{{end}}
