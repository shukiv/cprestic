<?xml version="1.0" encoding="UTF-8"?>
<!--
  cP:Restic, as a wordmark.

  The stacked mark in cprestic-icon.svg is for a 48x48 tile; this is the
  name in full, for a README or a page heading. Same rules apply: an
  <img> inherits neither font nor colour from the page around it, so the
  face is pinned with textLength and the ink follows the reader's theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96"
     role="img" aria-label="cP:Restic">
  <style>
    .cpr-ink { fill:#141A22; }
    .cpr-cp  { fill:#CF470C; }
    text {
      font-family:"Fira Sans","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
      font-weight:700; letter-spacing:-0.015em;
    }
    @media (prefers-color-scheme: dark) {
      .cpr-ink { fill:#E8EDF2; }
    }
  </style>
  <text class="cpr-ink" x="8" y="70" font-size="72" textLength="344" lengthAdjust="spacingAndGlyphs"><tspan class="cpr-cp">cP</tspan>:Restic</text>
</svg>
