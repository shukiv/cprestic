<?xml version="1.0" encoding="UTF-8"?>
<!--
  cP:Restic, as a square icon.

  WHM and cPanel both draw a plugin's icon in a 48x48 box, and the full
  lockup does not survive it: "Backup" under the mark would be six pixels
  tall. This is the monogram alone, which is what a favicon-sized mark can
  actually say.

  The cP is #CF470C, cPanel's orange, exactly as in the wordmark. The
  rest is the interface's own ink rather than pure black, so the two
  marks look like one family.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="img" aria-label="cP:Restic">
  <title>cP:Restic</title>
  <rect width="48" height="48" rx="9" fill="#FFFFFF"/>
  <text x="24" y="24" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Fira Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="19" letter-spacing="-0.5">
    <tspan fill="#CF470C">cP</tspan><tspan fill="#141A22">:R</tspan>
  </text>
</svg>
